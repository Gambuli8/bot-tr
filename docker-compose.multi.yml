# docker-compose.multi.yml
# 3 bots en paralelo (Fase 3, desde 2026-06-08):
# BTC + SOL + AVAX — todos con PriceActionEngine 1h, Futures USDT-M, leverage 7×.
# LINK descartado tras WFA en Fase 3 (no pasaba el threshold +10% OS con 7×).
#
# Cada bot usa su propio .env (.env.btc, .env.sol, .env.avax), su propio
# directorio data/<sym>/ y su propio nombre de container, pero comparten la
# imagen y la API key de Binance Futures.
#
# Setup detallado: docs/DEPLOYMENT_MULTI_ASSET.md
#
# Comandos:
#   docker compose -f docker-compose.multi.yml build
#   docker compose -f docker-compose.multi.yml up -d
#   docker compose -f docker-compose.multi.yml logs -f bot-btc
#   docker compose -f docker-compose.multi.yml down

x-bot-defaults: &bot-defaults
  build: .
  image: agent-trading:latest
  restart: unless-stopped
  labels:
    - autoheal=true
  environment:
    PYTHONUNBUFFERED: "1"
    PYTHONIOENCODING: "utf-8"
    TZ: "UTC"
  deploy:
    resources:
      limits:
        # 390 MB era lo que pedía el proceso al arrancar (pandas + ccxt + ta +
        # cache OHLCV 1h+4h). Con 384M caía en OOM kill repetidamente. 512M
        # da margen para picos. Con 4 bots → 4 × 512M = 2GB peak (requiere
        # VPS de 2GB RAM mínimo, recomendado 4GB).
        memory: 512M
        cpus: "0.40"
      reservations:
        memory: 128M
  logging:
    driver: "json-file"
    options:
      max-size: "20m"
      max-file: "5"

services:
  bot-btc:
    <<: *bot-defaults
    container_name: agent-trading-btc
    env_file:
      - .env.btc
    volumes:
      - ./data/btc:/app/data
      # Dir compartido entre los 3 bots → kill-switch de drawdown de portafolio.
      - ./data/_shared:/app/shared
    environment:
      PYTHONUNBUFFERED: "1"
      PYTHONIOENCODING: "utf-8"
      TZ: "UTC"
      # Marcadores que el cliente puede usar para diferenciar logs de los 4 bots
      BOT_SYMBOL_TAG: "BTC"
      SHARED_STATE_DIR: "/app/shared"

  bot-sol:
    <<: *bot-defaults
    container_name: agent-trading-sol
    env_file:
      - .env.sol
    volumes:
      - ./data/sol:/app/data
      - ./data/_shared:/app/shared
    environment:
      PYTHONUNBUFFERED: "1"
      PYTHONIOENCODING: "utf-8"
      TZ: "UTC"
      BOT_SYMBOL_TAG: "SOL"
      SHARED_STATE_DIR: "/app/shared"

  bot-avax:
    <<: *bot-defaults
    container_name: agent-trading-avax
    env_file:
      - .env.avax
    volumes:
      - ./data/avax:/app/data
      - ./data/_shared:/app/shared
    environment:
      PYTHONUNBUFFERED: "1"
      PYTHONIOENCODING: "utf-8"
      TZ: "UTC"
      BOT_SYMBOL_TAG: "AVAX"
      SHARED_STATE_DIR: "/app/shared"

  # LINK descartado en Fase 3 (WFA con leverage 7× → ❌ 3/7 OS positivas,
  # OS total +6.37%, PF mediano 0.97). Si querés re-evaluarlo, mirá los logs
  # del WFA en docs/BACKTESTS.md sección Fase 3.

  # Un solo autoheal para los 3 — vigila el label autoheal=true en todos.
  autoheal:
    image: willfarrell/autoheal:latest
    container_name: agent-trading-autoheal-multi
    restart: unless-stopped
    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal
      AUTOHEAL_INTERVAL: "30"
      AUTOHEAL_START_PERIOD: "120"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
