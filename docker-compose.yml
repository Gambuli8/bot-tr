services:
  bot:
    build: .
    image: agent-trading:latest
    container_name: agent-trading

    # Re-arranca solo si crashea o si el VPS reboota — clave para 24/7
    restart: unless-stopped

    # Etiqueta para el sidecar autoheal: reinicia este container si el HEALTHCHECK
    # lo marca "unhealthy" (loop colgado). restart: unless-stopped NO reinicia por
    # unhealthy — sólo por exit; autoheal cubre ese hueco.
    labels:
      - autoheal=true

    # Las credenciales y config vienen del .env (no se hardcodean en la imagen)
    env_file:
      - .env

    # Variables requeridas del .env (documentadas acá para que sepas qué pedir):
    #
    #   BINANCE_API_KEY        — Futures USDT-M (NO Spot keys)
    #   BINANCE_API_SECRET     — idem
    #   BINANCE_TESTNET        — "false" en producción
    #   TELEGRAM_BOT_TOKEN     — del @BotFather
    #   TELEGRAM_CHAT_ID       — tu chat_id (@userinfobot)
    #   ANTHROPIC_API_KEY      — solo si ENGINE=claude
    #   ENGINE                 — "scalping" | "price_action" | "claude"
    #   INITIAL_CAPITAL        — capital nominal (ej. 210)
    #   MAX_RISK_PER_TRADE     — ej. 0.08 (8%)
    #   DAILY_DRAWDOWN_LIMIT   — ej. 0.05 (5%)
    #   MAX_CONCURRENT_TRADES  — ej. 2
    #   ACTIVE_HOURS_UTC       — vacío = 24/7
    #
    # Si querés inyectar overrides desde el host (sin tocar el .env):
    environment:
      PYTHONUNBUFFERED: "1"        # logs en tiempo real (sin buffer)
      PYTHONIOENCODING: "utf-8"    # emojis en stdout
      TZ: "UTC"                    # timestamps consistentes

    # Estado runtime persistente — sobrevive a `compose down`, rebuilds y reboots.
    # IMPORTANTE: NO montamos ./logs porque ahí vive código (logs/logger.py).
    # El bot.log se guarda en data/ junto con el resto del runtime state.
    volumes:
      - ./data:/app/data           # state.json, trade_journal.jsonl, audit, bot.log

    # Recursos limitados para que el bot no se coma el VPS si hay leak
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.50"
        reservations:
          memory: 128M

    # Política de logs: 5 archivos de 20 MB = 100 MB max en /var/lib/docker
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  # ─────────────────────────────────────────
  #  Autoheal: reinicia el bot si queda "unhealthy" (loop colgado).
  #  Monitorea contenedores con label autoheal=true cada AUTOHEAL_INTERVAL seg.
  #  NOTA DE SEGURIDAD: monta el docker.sock (read-only acá) → acceso al daemon
  #  Docker. Es estándar para autoheal, pero tenelo en cuenta. Si preferís no
  #  montar el sock, sacá este service: el dead-man's switch externo igual te
  #  avisa y reiniciás a mano con `docker compose restart bot`.
  autoheal:
    image: willfarrell/autoheal:latest
    container_name: agent-trading-autoheal
    restart: unless-stopped
    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal
      AUTOHEAL_INTERVAL: "30"        # chequea cada 30s
      AUTOHEAL_START_PERIOD: "120"   # gracia tras (re)arranque
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
